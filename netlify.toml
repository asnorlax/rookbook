# Server-render /player/<username> pages so they carry unique, crawlable metadata + stats and
# become indexable by Google. The Edge Function (netlify/edge-functions/player.js) transforms the
# app shell; the /player/* -> /app.html rewrite in _redirects supplies that shell via context.next().
#
# NOTE: Edge Functions deploy reliably via Git (connect this folder to a GitHub repo) or the
# Netlify CLI (`netlify deploy --prod`). Pure browser drag-and-drop does not run functions.

# Static site served straight from the repo root — no build step.
[build]
  publish = "."
  command = ""

# Node functions. netlify/functions is Netlify's default, but name it explicitly: this
# directory holds lookups.mjs, which imports @netlify/blobs from package.json. Blobs must
# NOT be imported from an edge function — the specifier doesn't resolve in the Deno edge
# runtime and a bundling error there fails the whole build (see netlify/functions/lookups.mjs).
[functions]
  directory = "netlify/functions"

[[edge_functions]]
  path = "/player/*"
  function = "player"

# Keep test deploys out of Google. A branch deploy is a complete copy of the site on a public
# netlify.app URL, and Netlify does NOT mark those noindex on its own — checked directly, the
# branch URL came back with no x-robots-tag at all. An indexable second copy would compete with
# rookbook.net for rookbook.net's own terms, which is the last thing a site this new needs.
# Scoped to the two non-production contexts, so the live site is unaffected.
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"
